name: Sync upstream main

on:
  schedule:
    # Every day at 12:17 Japan Standard Time (03:17 UTC).
    - cron: '17 3 * * *'
  workflow_dispatch:

# GITHUB_TOKEN cannot update workflow files during an upstream sync.
# A fine-grained PAT with Contents (read/write) and Workflows (read/write)
# for geturin/rea must be stored as the REA_SYNC_PAT Actions secret.
permissions:
  contents: read

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'geturin/rea'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check sync credentials
        id: auth
        shell: bash
        env:
          SYNC_TOKEN: ${{ secrets.REA_SYNC_PAT }}
        run: |
          if [[ -z "$SYNC_TOKEN" ]]; then
            echo "::warning::Upstream sync skipped. Add repository Actions secret REA_SYNC_PAT with Contents and Workflows read/write permissions to enable full upstream sync."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout fork with full history
        if: steps.auth.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REA_SYNC_PAT }}
          fetch-depth: 0

      - name: Merge upstream main and push to fork
        if: steps.auth.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/morluto/rea.git
          git fetch --no-tags upstream main
          git merge --no-edit -m "chore: sync upstream main [skip ci]" upstream/main

          if [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]]; then
            echo "Fork is already up to date."
          else
            git push origin HEAD:main
          fi
