name: Sync upstream main

on:
  schedule:
    # Every day at 12:17 Japan Standard Time (03:17 UTC).
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'geturin/rea'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout fork with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream main and push to fork
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/morluto/rea.git
          git fetch --no-tags upstream main
          git merge --no-edit upstream/main
          git push origin HEAD:main
